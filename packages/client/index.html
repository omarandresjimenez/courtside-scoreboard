<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e1a" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Courtside Scoreboard</title>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="boot-loading"
      style="
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #0a0e1a;
        color: #94a3b8;
        font-family: ui-sans-serif, system-ui, sans-serif;
      "
    >
      <div
        style="
          width: 2.5rem;
          height: 2.5rem;
          border-radius: 50%;
          border: 3px solid rgba(148, 163, 184, 0.25);
          border-top-color: #22d3ee;
          animation: boot-spin 0.8s linear infinite;
        "
      ></div>
      <p style="margin: 0; font-size: 0.95rem">Loading…</p>
    </div>
    <style>
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div
      id="boot-error"
      style="
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: auto;
        box-sizing: border-box;
        padding: 2rem;
        background: #0a0e1a;
        color: #f1f5f9;
        font-family: ui-sans-serif, system-ui, sans-serif;
      "
    >
      <h1 style="margin-top: 0; font-size: 1.4rem; color: #f87171">This screen hit an error</h1>
      <p
        id="boot-error-message"
        style="font-size: 1.05rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word"
      ></p>
      <p style="color: #94a3b8; font-size: 0.9rem">
        Reload this page. If this keeps happening, this browser may be too old for this app — try a
        different device or a newer browser.
      </p>
    </div>
    <script>
      // Plain, non-module script — still runs even if this browser can't
      // load the module bundle below, which is the one place a TV device
      // with no dev tools can find out what actually went wrong. Kept in
      // old-style JS (var, function expressions) on purpose: the browsers
      // most likely to need this are the ones that choke on newer syntax.
      (function () {
        var shown = false;
        var root = document.getElementById('root');
        var neverStartedTimer = null;

        function hideLoading() {
          var loadingEl = document.getElementById('boot-loading');
          if (loadingEl) loadingEl.style.display = 'none';
        }

        function showBootError(message) {
          hideLoading();
          if (shown) return;
          shown = true;
          var messageEl = document.getElementById('boot-error-message');
          var overlayEl = document.getElementById('boot-error');
          if (messageEl) messageEl.textContent = message;
          if (overlayEl) overlayEl.style.display = 'block';
        }

        window.onerror = function (message, source, lineno, colno, error) {
          showBootError((error && error.stack) || message + ' (' + source + ':' + lineno + ')');
        };

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showBootError((reason && (reason.stack || reason.message)) || String(reason));
        });

        // The app can legitimately take a few seconds to arrive on a slow
        // device (a large bundle over LAN, an old TV's CPU) — that's a
        // loading state, not a failure, so it gets the spinner above, not
        // the error screen. Once real content lands in #root, get out of
        // its way entirely: hide the spinner, and hide the error overlay
        // too in case the not-started check already fired before this.
        if (root && window.MutationObserver) {
          var observer = new MutationObserver(function () {
            if (root.childNodes.length === 0) return;
            if (neverStartedTimer) window.clearTimeout(neverStartedTimer);
            hideLoading();
            var overlayEl = document.getElementById('boot-error');
            if (overlayEl) overlayEl.style.display = 'none';
            shown = false;
            observer.disconnect();
          });
          observer.observe(root, { childList: true });
        }

        neverStartedTimer = window.setTimeout(function () {
          if (!shown && root && root.childNodes.length === 0) {
            showBootError(
              'The app never started, and nothing threw an error — this browser likely ' +
                "doesn't support modern JavaScript (ES modules), which this app requires.",
            );
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
